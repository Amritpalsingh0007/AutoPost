spring.application.name=autopost

# PostgreSQL Configuration
# Override via env vars in production: DATABASE_URL, DATABASE_USERNAME, DATABASE_PASSWORD
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/autopost}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:password}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Temporary: trace Spring Security decisions to diagnose 403 on authenticated requests
# Remove or set to INFO once the issue is resolved
logging.level.org.springframework.security=WARN

# CORS — comma-separated list of allowed frontend origins
# Override in production via ALLOWED_ORIGINS env var
# Example: ALLOWED_ORIGINS=https://auto-post-lac-nine.vercel.app
app.cors.allowedOrigins=${ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# JWT — access token
# Must be a Base64-encoded string of at least 256 bits (32 bytes).
# Generate: openssl rand -base64 32
jwt.secretKey=${JWT_SECRET_KEY:dGhpcyBpcyBhIHZlcnkgc2VjdXJlIHNlY3JldCBrZXkgZm9yIGF1dG9wb3N0}

# JWT — refresh token lifetime in days (default 7)
jwt.refreshTokenExpiryDays=${JWT_REFRESH_TOKEN_EXPIRY_DAYS:7}

# GitHub API — optional personal access token to raise rate limit from 60 to 5000 req/hr.
# Leave blank for unauthenticated access (public repos only).
github.token=${GITHUB_TOKEN:}

# Gemini API key — set this when ready to test AI generation.
# Leave blank to use the stub fallback text.
gemini.apiKey=${GOOGLE_API_KEY:}

# Weekly grid — number of past weeks to include in TrackedRepoDto.weeklyGrid
app.weeklyGrid.weeks=${WEEKLY_GRID_WEEKS:12}



springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false